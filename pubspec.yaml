name: school_attendance_app
description: "AP School Attendance Management System - A complete Flutter solution for recording, monitoring, and reporting student attendance."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  pdf: ^3.10.7
  printing: ^5.11.0
  excel: ^4.0.3
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
